name: Android build and tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Prepare release signing keystore
        if: github.event_name != 'pull_request'
        env:
          MINIM_KEYSTORE_BASE64: ${{ secrets.MINIM_KEYSTORE_BASE64 }}
          MINIM_KEYSTORE_PASSWORD: ${{ secrets.MINIM_KEYSTORE_PASSWORD }}
          MINIM_KEY_ALIAS: ${{ secrets.MINIM_KEY_ALIAS }}
          MINIM_KEY_PASSWORD: ${{ secrets.MINIM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MINIM_KEYSTORE_BASE64" || { echo "Missing MINIM_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$MINIM_KEYSTORE_PASSWORD" || { echo "Missing MINIM_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$MINIM_KEY_ALIAS" || { echo "Missing MINIM_KEY_ALIAS repository secret"; exit 1; }
          test -n "$MINIM_KEY_PASSWORD" || { echo "Missing MINIM_KEY_PASSWORD repository secret"; exit 1; }
          printf '%s' "$MINIM_KEYSTORE_BASE64" | base64 --decode > app/minim-release.p12
          chmod 600 app/minim-release.p12
          {
            printf 'storeFile=app/minim-release.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$MINIM_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$MINIM_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$MINIM_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Run lint, unit tests and build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all --continue lintDebug testDebugUnitTest assembleDebug

      - name: Build signed Release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Verify Release APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" || { echo "Release APK not found"; exit 1; }
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner" || { echo "apksigner not found in Android SDK"; exit 1; }
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Print unit-test failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("app/build/test-results/testDebugUnitTest/**/*.xml", recursive=True))
          if not reports:
              print("No JUnit XML reports were produced.")
              raise SystemExit(0)

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          failed = []
          for path in reports:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as error:
                  print(f"Could not parse {path}: {error}")
                  continue
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, "0"))
                  for case in suite.iter("testcase"):
                      for kind in ("failure", "error"):
                          node = case.find(kind)
                          if node is not None:
                              failed.append((case.attrib.get("classname", ""), case.attrib.get("name", ""), kind, node.attrib.get("message", ""), node.text or ""))
          print("JUnit totals:", totals)
          for classname, name, kind, message, trace in failed:
              print(f"\n{kind.upper()}: {classname}.{name}: {message}\n{trace}")
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minim-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minim-youtube-music-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Release APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minim-youtube-music-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
