name: Android build and tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Run lint, unit tests and build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --warning-mode all --continue lintDebug testDebugUnitTest assembleDebug

      - name: Print unit-test failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("app/build/test-results/testDebugUnitTest/**/*.xml", recursive=True))
          if not reports:
              print("No JUnit XML reports were produced.")
              raise SystemExit(0)

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          failed = []
          for path in reports:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as error:
                  print(f"Could not parse {path}: {error}")
                  continue
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, "0"))
                  for case in suite.iter("testcase"):
                      for kind in ("failure", "error"):
                          node = case.find(kind)
                          if node is not None:
                              failed.append((case.attrib.get("classname", ""), case.attrib.get("name", ""), kind, node.attrib.get("message", ""), node.text or ""))
          print("JUnit totals:", totals)
          for classname, name, kind, message, trace in failed:
              print(f"\n{kind.upper()}: {classname}.{name}: {message}\n{trace}")
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minim-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: minim-youtube-music-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
